[project]
name = "msup"
description = "Micro serialization utilities for Python with CLI support."
version = "1.0"
requires-python = ">= 3.12"
license = "MIT"
authors = [
    {name = "Miguel Martin", email = "miguel@miguel-martin.com"}
]
maintainers = [
    {name = "Miguel Martin", email = "miguel@miguel-martin.com"}
]
readme = "README.md"
license-files = ["LICENSE"]
keywords = ["serialization", "encode", "dataclass", "cli", "argparse"]

[project.optional-dependencies]
pydantic = ["pydantic>=2,<3"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.15.22",
    "twine>=6.1.0",
    "ty>=0.0.61",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = [
    "msup",
    "tests",
    "examples",
]

[tool.ruff.lint.per-file-ignores]
"msup/base.py" = ["F811"]
"msup/cli.py" = ["F811"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
